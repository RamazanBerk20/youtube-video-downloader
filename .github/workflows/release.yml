name: Release

on:
  push:
    tags:
      - "v*"

# Third-party build steps run read-only; only the publish job can write.
permissions:
  contents: read

jobs:
  linux:
    # Oldest supported runner: AppImage/deb link against its glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Build AppImage and deb
        run: pnpm tauri build --bundles appimage,deb
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      # GitHub turns spaces in asset names into dots, which would no longer match
      # SHA256SUMS or the names the in-app updater looks for.
      - name: Normalise file names
        working-directory: src-tauri/target/release/bundle
        run: |
          for f in appimage/*.AppImage deb/*.deb; do
            mv "$f" "$(dirname "$f")/$(basename "${f// /-}")"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --locked
        working-directory: src-tauri
      - run: pnpm tauri build --bundles nsis
      - name: Normalise file names
        shell: bash
        working-directory: src-tauri/target/release/bundle/nsis
        run: |
          for f in *-setup.exe; do
            mv "$f" "${f// /-}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
      - name: Collect files and write SHA256SUMS
        run: |
          mkdir release
          # upload-artifact keeps the bundle subfolders (appimage/, deb/, nsis/)
          find artifacts -type f -exec mv -t release {} +
          cd release
          # In-app updater reads this: "<hash>  <name>", names only.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "YouTube Downloader $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Downloads: AppImage and .deb for Linux (x86_64), setup.exe for Windows (x86_64). Builds are unsigned; verify files against SHA256SUMS."
