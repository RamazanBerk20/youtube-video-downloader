[package]
name = "youtube-downloader"
version = "2.0.1"
description = "Fast, small desktop front-end for yt-dlp"
authors = ["YouTube Downloader contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.95"
default-run = "youtube-downloader"

[lib]
name = "ytdl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "youtube-downloader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "6.0.0"
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
ureq = "3.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
